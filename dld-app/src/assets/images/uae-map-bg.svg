<!-- UAE background map — PLACEHOLDER — swap with licensed asset before production -->
<!-- Coordinate system: viewBox 0 0 1000 600 matching lat 23.5–26.2 / lng 51.5–57.0 -->
<!-- Teal-green palette per MAP-SPEC.md §7 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" preserveAspectRatio="none">
  <defs>
    <!-- Gulf water gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6DD5CA"/>
      <stop offset="100%" stop-color="#83D8CF"/>
    </linearGradient>
    <!-- Land gradient -->
    <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4EBE0"/>
      <stop offset="100%" stop-color="#DDEFE8"/>
    </linearGradient>
  </defs>

  <!-- Water background (Persian Gulf + Gulf of Oman) -->
  <rect width="1000" height="600" fill="url(#waterGrad)"/>

  <!-- UAE mainland — simplified polygon (swap-later: commission accurate licensed boundary) -->
  <!-- Points derived from equirectangular projection of approximate UAE coastline -->
