  <circle cx="510" cy="345" r="5" fill="#3C786B" opacity="0.5"/>
  <!-- Dubai -->
  <circle cx="691" cy="210" r="5" fill="#3C786B" opacity="0.5"/>
  <!-- Sharjah -->
  <circle cx="718" cy="168" r="4" fill="#3C786B" opacity="0.4"/>

