  />

  <!-- Road/highway hints (decorative; teal palette per spec §7) -->
  <!-- E11 — Dubai–Abu Dhabi highway (approximate) -->
  <path d="M 455 519 L 480 480 L 530 430 L 580 370 L 618 310 L 660 262 L 691 210" stroke="#35C6A0" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- E611 — ring road hint -->
  <path d="M 645 262 L 691 190" stroke="#76D5B7" stroke-width="1.5" fill="none" opacity="0.5"/>

