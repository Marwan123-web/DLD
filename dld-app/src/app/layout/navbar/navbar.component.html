<header class="site-header" [class.is-scrolled]="isScrolled()" role="banner">

  <!-- Green top accent bar (visible in transparent state only) -->
  <div class="header-accent" aria-hidden="true"></div>

  <!-- TRANSPARENT STATE -->
  <div class="header-transparent">

    <!-- Logo row: Gov logo left, LD logo right -->
    <div class="container-xxl logo-row">
      <a routerLink="/" aria-label="Dubai Land Department Home">
        <img src="assets/images/logo.svg" alt="Government of Dubai" class="logo-gov" />
      </a>
      <a routerLink="/" aria-label="Land Department">
        <img src="assets/images/logo2.svg" alt="Land Department" class="logo-ld" />
      </a>
    </div>

    <!-- Nav row (desktop) -->
    <div class="container-xxl nav-row">
      <nav aria-label="Main navigation" class="main-nav">
        <ul class="nav-list" role="list">
          @for (link of navLinks; track link.path) {
            <li>
              <a [routerLink]="link.path" class="nav-link-t" routerLinkActive="active-t"
                 [routerLinkActiveOptions]="{ exact: !!link.exact }">
                {{ link.label }}
                @if (link.hasDropdown) {
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12" aria-hidden="true">
                    <path d="M2 5l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                }
              </a>
            </li>
          }
        </ul>
      </nav>
      <div class="nav-utils-t">
        <button class="util-search-pill" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          Search...
        </button>
        <button class="util-icon-btn" aria-label="Accessibility">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" aria-hidden="true">
            <circle cx="12" cy="5" r="2"/><path d="M12 22v-8m0 0l-4-4m4 4l4-4M6 9l6-2 6 2"/>
          </svg>
        </button>
        <button class="util-lang-btn" (click)="tr.toggleLang()">العربية</button>
        <button class="util-login-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Login
        </button>
      </div>
      <!-- Mobile hamburger (transparent state) -->
      <button class="hamburger-t" [class.is-open]="isMenuOpen()" (click)="toggleMenu()"
              [attr.aria-expanded]="isMenuOpen()" aria-label="Toggle menu" aria-controls="offcanvas-drawer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="24" height="24" aria-hidden="true">
          @if (isMenuOpen()) {
            <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
          } @else {
            <path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" stroke-linejoin="round"/>
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- PILL STATE -->
  <div class="header-pill" [class.visible]="isScrolled()">
    <div class="pill-inner">
      <!-- Left: emblem -->
      <a routerLink="/" class="pill-emblem-link" aria-label="Dubai Land Department Home">
        <img src="assets/images/logosignle.svg" alt="" class="pill-emblem" aria-hidden="true" />
      </a>
      <!-- Center: nav links -->
      <nav aria-label="Main navigation compact" class="pill-nav">
        <ul class="nav-list pill-nav-list" role="list">
          @for (link of navLinks; track link.path) {
            <li>
              <a [routerLink]="link.path" class="nav-link-p" routerLinkActive="active-p"
                 [routerLinkActiveOptions]="{ exact: !!link.exact }">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
      <!-- Right: utilities -->
      <div class="pill-utils">
        <button class="util-search-pill pill-search" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
          </svg>
          Search...
        </button>
        <button class="util-icon-btn dark" aria-label="Accessibility">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="5" r="2"/><path d="M12 22v-8m0 0l-4-4m4 4l4-4M6 9l6-2 6 2"/>
          </svg>
        </button>
        <button class="util-lang-btn dark" (click)="tr.toggleLang()">العربية</button>
        <button class="util-login-filled">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Login
        </button>
        <div class="pill-avatar" aria-hidden="true">
          <img src="assets/images/logo2signle.svg" alt="" />
        </div>
      </div>
      <!-- Mobile hamburger (pill state) -->
      <button class="hamburger-p" [class.is-open]="isMenuOpen()" (click)="toggleMenu()"
              [attr.aria-expanded]="isMenuOpen()" aria-label="Toggle menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="22" height="22" aria-hidden="true">
          @if (isMenuOpen()) {
            <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
          } @else {
            <path d="M3 12h18M3 6h18M3 18h18" stroke-linecap="round" stroke-linejoin="round"/>
          }
        </svg>
      </button>
    </div>
  </div>

  <!-- OFFCANVAS OVERLAY -->
  @if (isMenuOpen()) {
    <div class="offcanvas-overlay" (click)="closeMenu()" aria-hidden="true"></div>
  }

  <!-- OFFCANVAS DRAWER -->
  <nav id="offcanvas-drawer" class="offcanvas-drawer" [class.is-open]="isMenuOpen()"
       role="dialog" aria-modal="true" [attr.aria-hidden]="!isMenuOpen()" aria-label="Navigation menu">
    <ul role="list" class="offcanvas-list">
      @for (link of navLinks; track link.path) {
        <li>
          <a [routerLink]="link.path" class="offcanvas-link" routerLinkActive="active" (click)="closeMenu()">
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
    <div class="offcanvas-footer">
      <button class="util-lang-btn dark" (click)="tr.toggleLang()">العربية</button>
    </div>
  </nav>

</header>
