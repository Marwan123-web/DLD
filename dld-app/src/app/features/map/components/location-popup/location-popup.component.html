@if (store.selectedLocation(); as loc) {
  <div
    #popup
    class="popup"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'popup-title-' + loc.id"
    (keydown)="onKeydown($event)"
  >
    @if (loc.image) {
      <div class="popup__image-wrap">
        <img [src]="loc.image" [alt]="loc.name" class="popup__image" />
      </div>
    }

    <div class="popup__body">
      <div class="popup__header">
        <div>
          <h3 class="popup__title" [id]="'popup-title-' + loc.id">{{ loc.name }}</h3>
          <p class="popup__subtitle">{{ loc.emirate }}</p>
        </div>

        <button
          class="popup__close"
          (click)="close()"
          [attr.aria-label]="tr.t('map.popup_close')"
          type="button"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="popup__chips">
        <span class="chip chip--emirate">{{ loc.emirate }}</span>
        <span class="chip chip--coords">{{ coordsLabel() }}</span>
        @if (loc.population) {
          <span class="chip chip--pop">{{ tr.t('map.popup_pop_prefix') }} {{ populationFormatted() }}</span>
        }
      </div>

      @if (loc.description) {
        <p class="popup__desc">{{ loc.description }}</p>
      }

      <div class="popup__actions">
        <button
          class="popup__analytics-btn"
          type="button"
          (click)="viewAnalytics()"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 20V10M12 20V4M6 20v-6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          {{ tr.t('map.popup_view_analytics') }}
        </button>
      </div>
    </div>
  </div>
}
