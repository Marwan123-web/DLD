<div class="toolbar" role="search">
  <!-- Brand mark -->
  <div class="toolbar__brand" aria-hidden="true">
    <span class="brand-dot"></span>
    <span class="brand-label">{{ tr.t('map.brand_label') }}</span>
  </div>

  <!-- Search + filter controls -->
  <div class="toolbar__controls">
    <!-- Search -->
    <div class="toolbar__search-wrap">
      <label class="sr-only" for="map-search">{{ tr.t('map.search_label') }}</label>
      <svg class="toolbar__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35" stroke-linecap="round"/>
      </svg>
      <input
        id="map-search"
        type="search"
        class="toolbar__search"
        [placeholder]="tr.t('map.search_placeholder')"
        [(ngModel)]="searchValue"
        [attr.aria-label]="tr.t('map.search_label')"
        autocomplete="off"
      />
    </div>

    <!-- Emirate filter -->
    <div class="toolbar__select-wrap">
      <label class="sr-only" for="map-emirate-filter">{{ tr.t('map.filter_label') }}</label>
      <select
        id="map-emirate-filter"
        class="toolbar__select"
        [(ngModel)]="emirateValue"
        [attr.aria-label]="tr.t('map.filter_label')"
      >
        @for (emirate of store.emirates(); track emirate) {
          <option [value]="emirate">
            {{ emirate === 'All' ? tr.t('map.filter_all') : emirate }}
          </option>
        }
      </select>
      <svg class="toolbar__select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- Reset filters button -->
    <button
      class="toolbar__reset"
      type="button"
      (click)="store.resetFilters()"
      [attr.aria-label]="tr.t('map.reset_filters')"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      {{ tr.t('map.reset_filters') }}
    </button>
  </div>

  <!-- Theme toggle -->
  <div class="toolbar__end">
    <button
      class="toolbar__theme-btn"
      type="button"
      (click)="theme.toggle()"
      [attr.aria-label]="themeAriaLabel"
      [attr.aria-pressed]="theme.isDark()"
    >
      @if (theme.isDark()) {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke-linecap="round"/>
        </svg>
      } @else {
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      }
    </button>
  </div>
</div>
